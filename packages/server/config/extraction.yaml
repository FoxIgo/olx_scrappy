# LLM extraction profiles (ADR 0010, docs/adr/0010-decoupled-batch-extraction.md).
#
# The extractor loop (`scrappy worker`, or `scrappy extract --inline`) reconciles the
# extraction backlog with ALL profiles of `pool` IN PARALLEL (ADR 0010 section 9): one lane
# per profile, each within its own rate_limit, concurrency and daily_limit, all taking offers
# from the same backlog. Total throughput = the sum of the lanes. A lane that is unavailable
# (server down, key missing, 402, daily limit used up) is skipped until it recovers while the
# others continue. `scrappy extract profiles` shows health and capabilities per lane.
#
# Secrets never go here: `api_key_env` names an environment variable (or a .env entry).
# Without this file, one `openrouter` profile is derived from the SCRAPPY_LLM_* settings.

# Google AI Studio free tier: quotas are PER MODEL, so each Google model is its own budget.
# OpenRouter `:free` models are another provider and share one account-wide daily limit (see
# quota_groups). `lmstudio` (local, slow) and `openrouter` (PAID) are defined but deliberately
# not in the pool. SAFETY: an OpenRouter model whose id does not end in `:free` is paid; the
# loader refuses it in the pool unless its profile says `paid: true`.
# The first pool member is the "default" profile (backlog counting, `q health`).
# Everything runs in parallel (user, 2026-10-10). `openrouter` is PAID but ~$0.03 per 1000 offers
# (ling-3.0-flash-vl: $0.021/M in, $0.063/M out); `lmstudio` is local and simply idles
# (unhealthy lane) when LM Studio isn't running.
pool: [gemini-lite, gemini-lite-31, gemma-31b, gemma-26b, openrouter-free-nemotron, openrouter, lmstudio]

# Daily limits shared by several profiles (the profiles then name `quota_group` instead of
# daily_limit/quota_timezone). OpenRouter: all `:free` models together get 50 requests/day,
# or 1000/day once the account has ever bought >= $10 of credits (UNKNOWN for this account, so
# the safe 50 is configured; raise it if you did buy credits). OpenRouter documents the limit as
# daily but not the reset time: UTC midnight is an assumption. A 429 naming "per-day" blocks
# the whole group until the next UTC midnight.
quota_groups:
  openrouter_free: {daily_limit: 50, quota_timezone: UTC}

reconciler:
  interval_seconds: 30          # idle pause between reconcile ticks
  poll_interval_seconds: 60     # how often open provider batches are polled
  max_attempts: 5               # failures (per offer and content) before it is parked
  backoff_base_seconds: 60      # 1 min, 2 min, 4 min, ... capped at backoff_max_minutes
  backoff_max_minutes: 360
  quota_cooldown_minutes: 60    # a profile that answered 402 is skipped this long
  # description_max_chars: 4000 # default: SCRAPPY_LLM_MAX_DESCRIPTION_CHARS

profiles:
  openrouter:                   # PAID, approved for the pool (user, 2026-10-10)
    provider: openrouter
    model: inclusionai/ling-3.0-flash-vl
    paid: true
    api_key_env: OPENROUTER_API_KEY
    mode: sync                  # sync | batch | auto (batch needs the OpenRouter batch adapter)
    structured_output: json_schema   # json_schema | json_object | prompt_only
    concurrency: 4              # parallel calls in sync mode
    timeout_seconds: 60
    temperature: 0
    batch: {min_size: 20, max_size: 200, max_open: 3, max_wait_minutes: 30}

  # Local Ollama (from Docker: base_url http://host.docker.internal:11434/v1).
  # Ollama's default context is 4096 tokens, which truncates our prompts: raise num_ctx.
  # local:
  #   provider: openai_compatible
  #   base_url: http://localhost:11434/v1
  #   model: qwen2.5:7b-instruct
  #   mode: sync
  #   concurrency: 1              # one GPU: keep it serial
  #   structured_output: json_schema
  #   timeout_seconds: 180
  #   extra_body: {options: {num_ctx: 8192}}
  #   # Qwen3 / Gemma thinking models: also turn thinking off, e.g.
  #   # extra_body: {reasoning_effort: none, options: {num_ctx: 8192}}

  # LM Studio's OpenAI-compatible server (load the model in LM Studio first).
  # Gemma 4 "thinks" by default: measured 38.6 s and ~1500 output tokens per offer.
  # With reasoning_effort none: 5.9 s and ~128 tokens. Keep it in extra_body.
  lmstudio:
    provider: openai_compatible
    base_url: http://localhost:1235/v1
    model: google/gemma-4-12b-qat
    mode: sync
    concurrency: 1
    structured_output: json_schema   # downgraded by `scrappy extract profiles --probe` if rejected
    temperature: 0
    extra_body: {reasoning_effort: "none"}

  # Google AI Studio free tier through its OpenAI-compatible endpoint (key: GOOGLE_API_KEY).
  # Free quotas (RPM / TPM / RPD) per model; limits below sit slightly under them. Daily quotas
  # reset at midnight Pacific time, hence quota_timezone. A 429 with PerDay quota blocks the
  # profile until that reset (the chain moves on, offers are not penalised); a PerMinute 429
  # waits the provider's retryDelay and retries.
  gemini-lite:                    # 15 / 250K / 500
    provider: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.5-flash-lite
    api_key_env: GOOGLE_API_KEY
    mode: sync
    structured_output: json_schema
    temperature: 0
    concurrency: 3                # ~1 s per offer
    rate_limit: 14/min
    daily_limit: 480
    quota_timezone: America/Los_Angeles
    timeout_seconds: 60

  gemini-lite-31:                 # 15 / 250K / 500
    provider: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.1-flash-lite
    api_key_env: GOOGLE_API_KEY
    mode: sync
    structured_output: json_schema
    temperature: 0
    concurrency: 3
    rate_limit: 14/min
    daily_limit: 480
    quota_timezone: America/Los_Angeles
    timeout_seconds: 60

  # Gemma 4 on Google always "thinks" (hidden, 23-30 s per call) and rejects reasoning_effort /
  # thinking options with HTTP 400, so never put those in extra_body (the loader refuses).
  # Only json_schema works reliably (prompt_only / json_object leak "<thought>" text).
  # Throughput comes from concurrency: 8 calls in flight x ~25 s ~= 19/min. The 16K TPM quota
  # (~820 tokens per offer) is the real cap, so rate_limit is 15/min rather than the 30 RPM.
  gemma-31b:                      # 30 / 16K / 14.4K
    provider: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemma-4-31b-it
    api_key_env: GOOGLE_API_KEY
    mode: sync
    structured_output: json_schema
    temperature: 0
    concurrency: 8
    rate_limit: 15/min
    daily_limit: 14000
    quota_timezone: America/Los_Angeles
    timeout_seconds: 120

  # OpenRouter FREE model (key: OPENROUTER_API_KEY). Free models share ~20 requests/minute and
  # the group's daily limit above across the whole account. They also hit upstream 429s
  # ("temporarily rate-limited upstream", metadata.limit_source = upstream_provider_shared_pool):
  # that pauses only this lane for a minute, offers are released without penalty.
  openrouter-free-nemotron:
    provider: openai_compatible
    base_url: https://openrouter.ai/api/v1
    model: nvidia/nemotron-3-super-120b-a12b:free
    api_key_env: OPENROUTER_API_KEY
    mode: sync
    structured_output: json_schema
    temperature: 0
    concurrency: 2
    rate_limit: 20/min
    quota_group: openrouter_free
    timeout_seconds: 120

  gemma-26b:                      # 30 / 16K / 14.4K
    provider: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemma-4-26b-a4b-it
    api_key_env: GOOGLE_API_KEY
    mode: sync
    structured_output: json_schema
    temperature: 0
    concurrency: 8
    rate_limit: 15/min
    daily_limit: 14000
    quota_timezone: America/Los_Angeles
    timeout_seconds: 120
