# LLM extraction profiles (ADR 0010, docs/adr/0010-decoupled-batch-extraction.md).
#
# The extractor loop (`scrappy worker`, or `scrappy extract --inline`) reconciles the
# extraction backlog with the default profile and falls back along `fallback` when a
# profile is unavailable (server down, model missing, key missing, 402 / out of quota,
# daily limit used up). `scrappy extract profiles` shows health and capabilities.
#
# Secrets never go here: `api_key_env` names an environment variable (or a .env entry).
# Without this file, one `openrouter` profile is derived from the SCRAPPY_LLM_* settings.

default_profile: gemini-lite
# Google AI Studio free tier: quotas are PER MODEL, so each model below is its own budget and the
# next one takes over when a model's daily quota is used up. `lmstudio` (local, slow) and
# `openrouter` (PAID) are defined but deliberately not in the chain: append them manually
# (e.g. `..., gemma-26b, openrouter`) if you want a paid last resort.
fallback: [gemini-lite, gemini-lite-31, gemma-31b, gemma-26b]

reconciler:
  interval_seconds: 30          # idle pause between reconcile ticks
  poll_interval_seconds: 60     # how often open provider batches are polled
  max_attempts: 5               # failures (per offer and content) before it is parked
  backoff_base_seconds: 60      # 1 min, 2 min, 4 min, ... capped at backoff_max_minutes
  backoff_max_minutes: 360
  quota_cooldown_minutes: 60    # a profile that answered 402 is skipped this long
  # description_max_chars: 4000 # default: SCRAPPY_LLM_MAX_DESCRIPTION_CHARS

profiles:
  openrouter:                   # the default: same model and behaviour as before ADR 0010
    provider: openrouter
    # model: openai/gpt-4o-mini # default: SCRAPPY_LLM_MODEL
    api_key_env: OPENROUTER_API_KEY
    mode: sync                  # sync | batch | auto (batch needs the OpenRouter batch adapter)
    structured_output: json_schema   # json_schema | json_object | prompt_only
    concurrency: 4              # parallel calls in sync mode
    timeout_seconds: 60
    temperature: 0
    batch: {min_size: 20, max_size: 200, max_open: 3, max_wait_minutes: 30}

  # Local Ollama (from Docker: base_url http://host.docker.internal:11434/v1).
  # Ollama's default context is 4096 tokens, which truncates our prompts: raise num_ctx.
  # local:
  #   provider: openai_compatible
  #   base_url: http://localhost:11434/v1
  #   model: qwen2.5:7b-instruct
  #   mode: sync
  #   concurrency: 1              # one GPU: keep it serial
  #   structured_output: json_schema
  #   timeout_seconds: 180
  #   extra_body: {options: {num_ctx: 8192}}
  #   # Qwen3 / Gemma thinking models: also turn thinking off, e.g.
  #   # extra_body: {reasoning_effort: none, options: {num_ctx: 8192}}

  # LM Studio's OpenAI-compatible server (load the model in LM Studio first).
  # Gemma 4 "thinks" by default: measured 38.6 s and ~1500 output tokens per offer.
  # With reasoning_effort none: 5.9 s and ~128 tokens. Keep it in extra_body.
  lmstudio:
    provider: openai_compatible
    base_url: http://localhost:1235/v1
    model: google/gemma-4-12b-qat
    mode: sync
    concurrency: 1
    structured_output: json_schema   # downgraded by `scrappy extract profiles --probe` if rejected
    temperature: 0
    extra_body: {reasoning_effort: "none"}

  # Google AI Studio free tier through its OpenAI-compatible endpoint (key: GOOGLE_API_KEY).
  # Free quotas (RPM / TPM / RPD) per model; limits below sit slightly under them. Daily quotas
  # reset at midnight Pacific time, hence quota_timezone. A 429 with PerDay quota blocks the
  # profile until that reset (the chain moves on, offers are not penalised); a PerMinute 429
  # waits the provider's retryDelay and retries.
  gemini-lite:                    # 15 / 250K / 500
    provider: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.5-flash-lite
    api_key_env: GOOGLE_API_KEY
    mode: sync
    structured_output: json_schema
    temperature: 0
    concurrency: 3                # ~1 s per offer
    rate_limit: 14/min
    daily_limit: 480
    quota_timezone: America/Los_Angeles
    timeout_seconds: 60

  gemini-lite-31:                 # 15 / 250K / 500
    provider: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.1-flash-lite
    api_key_env: GOOGLE_API_KEY
    mode: sync
    structured_output: json_schema
    temperature: 0
    concurrency: 3
    rate_limit: 14/min
    daily_limit: 480
    quota_timezone: America/Los_Angeles
    timeout_seconds: 60

  # Gemma 4 on Google always "thinks" (hidden, 23-30 s per call) and rejects reasoning_effort /
  # thinking options with HTTP 400, so never put those in extra_body (the loader refuses).
  # Only json_schema works reliably (prompt_only / json_object leak "<thought>" text).
  # Throughput comes from concurrency: 8 calls in flight x ~25 s ~= 19/min. The 16K TPM quota
  # (~820 tokens per offer) is the real cap, so rate_limit is 15/min rather than the 30 RPM.
  gemma-31b:                      # 30 / 16K / 14.4K
    provider: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemma-4-31b-it
    api_key_env: GOOGLE_API_KEY
    mode: sync
    structured_output: json_schema
    temperature: 0
    concurrency: 8
    rate_limit: 15/min
    daily_limit: 14000
    quota_timezone: America/Los_Angeles
    timeout_seconds: 120

  gemma-26b:                      # 30 / 16K / 14.4K
    provider: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemma-4-26b-a4b-it
    api_key_env: GOOGLE_API_KEY
    mode: sync
    structured_output: json_schema
    temperature: 0
    concurrency: 8
    rate_limit: 15/min
    daily_limit: 14000
    quota_timezone: America/Los_Angeles
    timeout_seconds: 120
