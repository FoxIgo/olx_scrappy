[project]
name = "scrappy"
version = "0.1.0"
description = "Marketplace offer scraper with LLM attribute extraction (olx_scrappy server)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy[asyncio]>=2",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6",
    "scrapling",          # core: parser + plain HTTP fetcher only
    "openai>=1",          # OpenAI-compatible client, pointed at OpenRouter
    "structlog>=24",
    "curl-cffi>=0.16.3",
    "alembic>=1.20.0",
    "aiosqlite>=0.22.1",
    "rich>=15.0.0",
    "tzdata>=2026.5",
]

[project.optional-dependencies]
# Browser engines (Playwright/Camoufox fetchers). Not part of the base image.
browser = ["scrapling[fetchers]"]

[project.scripts]
scrappy = "scrappy.main:cli"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyright",
    "import-linter",
    "poethepoet",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrappy"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "ASYNC", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# compact "x is not None and x.field == ..." narrowing asserts in adapter round-trip tests
"tests/integration/**" = ["PT018"]
# one-off dev tools (synthetic data seeding): long report lines and asserts are fine
"scripts/dev/**" = ["E501", "PT018"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/scrappy/domain", "src/scrappy/application"]
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -m \"not live\""
markers = ["live: hits the real network; opt in with `pytest -m live`"]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "scrappy"
include_external_packages = true

# scrappy.main is deliberately in no layer: the composition root may import everything,
# and no layer may import it back (it is not listed, so it is unconstrained).
[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
    "scrappy.presentation | scrappy.infrastructure",
    "scrappy.application",
    "scrappy.domain",
]

[[tool.importlinter.contracts]]
name = "Domain uses only the standard library"
type = "forbidden"
source_modules = ["scrappy.domain"]
forbidden_modules = ["pydantic", "pydantic_settings", "sqlalchemy", "httpx", "scrapling", "openai", "typer", "yaml", "structlog"]

[[tool.importlinter.contracts]]
name = "Application does not import adapters or frameworks"
type = "forbidden"
source_modules = ["scrappy.application"]
forbidden_modules = ["sqlalchemy", "httpx", "scrapling", "openai", "typer"]

# ---------------------------------------------------------------- poe
[tool.poe.tasks]
lint = [{ cmd = "ruff check ." }, { cmd = "ruff format --check ." }]
fmt = [{ cmd = "ruff check --fix ." }, { cmd = "ruff format ." }]
typecheck = "pyright"
layers = "lint-imports"
test = "pytest"
check = ["lint", "typecheck", "layers", "test"]
